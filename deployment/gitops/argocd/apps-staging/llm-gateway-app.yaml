apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Tanmoy095/LogiFlow-Platform
    targetRevision: main
    path: deployment/helm/services/llm-gateway
    helm:
      valueFiles:
      - values-dev.yaml
      - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: logiflow-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
