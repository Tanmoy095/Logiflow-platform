# values-prod.yaml – overrides for production
#DEPLOYMENT/HELM/SERVICES/llm-gateway/VALUES-PROD.YAML

replicaCount: 3
image:
  tag: 1.0.0
  pullPolicy: IfNotPresent
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi
config:
  routingPolicy: "cost-optimized"
  modelTimeout: "60s"
