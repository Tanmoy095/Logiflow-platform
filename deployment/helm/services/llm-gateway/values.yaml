#deployment/helm/services/llm-gateway/values-dev.yaml
# LLM Gateway Service – Default Values
# ------------------------------------------------------------

# LLM Gateway Service – Default Values
# This file provides safe defaults for all environments.
# Specific environments override via values-dev.yaml, values-staging.yaml, values-prod.yaml.
replicaCount: 1

image:
  repository: logiflow/llm-gateway
  tag: local
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

probes:
  startup:
    path: /healthz
  readiness:
    path: /healthz
  liveness:
    path: /live

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

config:
  logLevel: "info"
  routingPolicy: "cost-optimized"
  modelTimeout: "30s"
